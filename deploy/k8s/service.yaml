apiVersion: v1
kind: Service
metadata:
  name: summer-backend-service
  namespace: summer-prod
  labels:
    app: summer-backend
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: summer-backend
---
apiVersion: v1
kind: Service
metadata:
  name: summer-redis-service
  namespace: summer-prod
  labels:
    app: summer-redis
    tier: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: summer-redis
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: summer-backend-hpa
  namespace: summer-prod
  labels:
    app: summer-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: summer-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
